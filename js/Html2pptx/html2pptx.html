<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slide Editor — HTML to PPTX</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="./froala_editor_4.6.2/css/froala_editor.pkgd.min.css" rel="stylesheet"/>
<link href="./froala_editor_4.6.2/css/froala_style.min.css" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #00205B;
  --navy-light: #1a3a7a;
  --accent: #3B6FD4;
  --accent-light: #e8f0fc;
  --bg: #eef0f6;
  --surface: #ffffff;
  --surface2: #f5f6fa;
  --border: #dde1ed;
  --text: #1a1d2e;
  --muted: #6b7280;
  --danger: #dc2626;
  --success: #15803d;
  --shadow: 0 2px 10px rgba(0,32,91,0.07);
  --shadow-lg: 0 8px 28px rgba(0,32,91,0.13);
}

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* TOPBAR */
.topbar {
  background: var(--navy);
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 10px;
  flex-shrink: 0;
  z-index: 100;
}
.topbar-logo {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: 4px;
}
.topbar-logo svg { width: 20px; height: 20px; flex-shrink: 0; }
.topbar-div { width: 1px; height: 24px; background: rgba(255,255,255,0.2); margin: 0 4px; }
.topbar-spacer { flex: 1; }
.tbtn {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 7px; border: none;
  font-family: inherit; font-size: 12.5px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.tbtn.ghost { background: rgba(255,255,255,0.1); color: #fff; }
.tbtn.ghost:hover { background: rgba(255,255,255,0.2); }
.tbtn.accent { background: var(--accent); color: #fff; }
.tbtn.accent:hover { background: #2d5fba; }
.tbtn.green { background: #15803d; color: #fff; }
.tbtn.green:hover { background: #166534; }
.slide-badge {
  background: rgba(255,255,255,0.13);
  color: rgba(255,255,255,0.85);
  border-radius: 6px; padding: 4px 10px;
  font-size: 12px; font-weight: 500;
}

/* LAYOUT */
.app-body { display: flex; flex: 1; min-height: 0; }

/* SIDEBAR */
.sidebar {
  width: 210px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sb-head {
  padding: 11px 14px;
  font-size: 10.5px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.sb-add-btn {
  width: 22px; height: 22px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 15px; cursor: pointer;
  transition: all .15s; line-height: 1;
}
.sb-add-btn:hover { background: var(--accent-light); border-color: var(--accent); }

.slide-list {
  flex: 1; overflow-y: auto;
  padding: 8px;
  display: flex; flex-direction: column; gap: 5px;
}

/* THUMB */
.slide-thumb {
  position: relative;
  border: 2px solid var(--border);
  border-radius: 7px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  background: var(--bg); overflow: hidden;
  user-select: none;
}
.slide-thumb:hover { border-color: var(--accent); }
.slide-thumb.active { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,32,91,.1); }
.slide-thumb.drag-over { border-color: var(--accent); background: var(--accent-light); border-style: dashed; }
.slide-thumb.dragging { opacity: .4; }

.thumb-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.thumb-num { font-size: 10px; font-weight: 600; color: var(--muted); }
.thumb-actions { display: flex; gap: 2px; }
.thumb-btn {
  width: 18px; height: 18px; border-radius: 4px;
  border: none; background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; cursor: pointer; color: var(--muted);
  transition: all .15s;
}
.thumb-btn:hover { background: var(--bg); color: var(--text); }
.thumb-btn.del:hover { background: #fee2e2; color: var(--danger); }
.thumb-btn.handle { cursor: grab; font-size: 13px; }
.thumb-btn.handle:active { cursor: grabbing; }

.thumb-preview {
  width: 100%; aspect-ratio: 16/9;
  overflow: hidden; pointer-events: none;
}
.thumb-preview iframe {
  width: 1280px; height: 720px; border: none;
  transform: scale(0.144); transform-origin: top left;
  pointer-events: none;
}

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* TABS */
.tabs {
  display: flex; background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 18px; flex-shrink: 0;
}
.tab {
  padding: 11px 18px; font-size: 13px; font-weight: 500;
  color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent; transition: all .15s;
  white-space: nowrap;
}
.tab.active { color: var(--navy); border-bottom-color: var(--navy); }
.tab:hover:not(.active) { color: var(--text); }

/* VIEWS */
.view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }

/* NAV BAR */
.nav-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.nav-btn {
  width: 30px; height: 30px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--bg);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all .15s;
}
.nav-btn:disabled { opacity: .3; cursor: default; }
.nav-btn:not(:disabled):hover { background: var(--accent-light); border-color: var(--accent); }
.nav-info { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.nav-spacer { flex: 1; }
.btn {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 13px; border-radius: 7px; border: none;
  font-family: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .15s;
}
.btn.outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn.outline:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--navy); color: #fff; }
.btn.primary:hover { background: var(--navy-light); }
.btn.accent-btn { background: var(--accent); color: #fff; }
.btn.accent-btn:hover { background: #2d5fba; }
.btn:disabled { opacity: .5; cursor: default; }

/* SINGLE VIEW */
.preview-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 28px; overflow: auto;
}
.preview-frame {
  background: #fff; box-shadow: var(--shadow-lg);
  border-radius: 4px; overflow: hidden;
  width: 960px; height: 540px; flex-shrink: 0;
}
.preview-frame iframe {
  width: 1280px; height: 720px; border: none;
  transform: scale(.75); transform-origin: top left;
  pointer-events: none;
}
.zoom-readout {
  min-width: 56px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 12px;
  color: var(--muted); font-size: 14px;
}
.empty-icon { font-size: 52px; opacity: .25; }

/* GRID VIEW */
.grid-scroll { flex: 1; overflow-y: auto; padding: 20px; }
.grid-inner {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; align-content: start;
}
.grid-card {
  background: var(--surface); border: 2px solid var(--border);
  border-radius: 10px; overflow: hidden; cursor: pointer;
  transition: all .15s; box-shadow: var(--shadow);
  user-select: none;
}
.grid-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.grid-card.active { border-color: var(--navy); }
.grid-card.drag-over { border-color: var(--accent); background: var(--accent-light); border-style: dashed; transform: none; }
.grid-card.dragging { opacity: .4; }
.gc-preview {
  width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--bg);
  pointer-events: none;
}
.gc-preview iframe {
  width: 1280px; height: 720px; border: none;
  transform-origin: top left; pointer-events: none;
}
.gc-footer {
  padding: 9px 12px; display: flex; align-items: center;
  justify-content: space-between; border-top: 1px solid var(--border);
}
.gc-title { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.gc-actions { display: flex; gap: 4px; }
.gc-btn {
  width: 25px; height: 25px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all .15s; color: var(--muted);
}
.gc-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.gc-btn.del:hover { background: #fee2e2; border-color: var(--danger); color: var(--danger); }
.gc-btn.handle { cursor: grab; }
.gc-btn.handle:active { cursor: grabbing; }

/* EDIT VIEW */
.edit-top {
  flex: 0 0 auto; height: 330px;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.edit-preview-frame {
  background: #fff; box-shadow: var(--shadow-lg);
  border-radius: 4px; overflow: hidden;
  width: 568px; height: 320px; flex-shrink: 0;
}
.edit-preview-frame iframe {
  width: 1280px; height: 720px; border: none;
  transform: scale(.4444); transform-origin: top left;
  pointer-events: none;
}
.edit-panel {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface);
}
#view-edit.full-editor .edit-top { display: none; }
#view-edit.full-editor .edit-panel { flex: 1; min-height: 0; }
.edit-panel-head {
  padding: 8px 14px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  font-size: 11.5px; font-weight: 600; color: var(--muted);
}
.edit-panel-head span { color: var(--accent); }
.edit-toolbar {
  padding: 6px 10px; display: flex; gap: 5px;
  border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
}
.edit-mode-toggle {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.edit-mode-toggle.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}
.edit-mode-toggle:hover {
  border-color: var(--accent);
}
.raw-mode-only.hidden,
.wysiwyg-mode-only.hidden {
  display: none !important;
}
.etbtn {
  padding: 4px 9px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; cursor: pointer; color: var(--text);
  transition: all .15s;
}
.etbtn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.edit-textarea {
  flex: 1; border: none; outline: none; resize: none;
  padding: 10px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.65;
  background: var(--surface2); color: var(--text); overflow-y: auto;
}
.edit-wysiwyg-host {
  flex: 1;
  min-height: 0;
  background: var(--surface2);
  overflow: hidden;
}
.edit-wysiwyg-host .fr-box {
  border: none;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.edit-wysiwyg-host .fr-wrapper {
  flex: 1;
  min-height: 0;
  overflow: auto;
}
.edit-wysiwyg-host .fr-toolbar {
  border-left: none;
  border-right: none;
}
.edit-wysiwyg-host .fr-element {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  line-height: 1.55;
}
.edit-save-row {
  padding: 7px 12px; display: flex; gap: 6px; justify-content: flex-end;
  border-top: 1px solid var(--border); flex-shrink: 0; background: var(--surface);
}

/* MODAL */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.38);
  z-index: 200; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--surface); border-radius: 14px;
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  overflow: hidden;
  transform: translateY(10px); transition: transform .2s;
}
.overlay.open .modal { transform: translateY(0); }
.modal-head {
  padding: 16px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.modal-title { font-size: 15px; font-weight: 600; }
.modal-x {
  width: 28px; height: 28px; border-radius: 7px;
  border: 1px solid var(--border); background: transparent;
  cursor: pointer; font-size: 14px; color: var(--muted);
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.modal-x:hover { background: var(--bg); }
.modal-body { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.modal-foot {
  padding: 12px 18px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
}
.modal-hint {
  font-size: 12px; color: var(--muted); background: var(--bg);
  border-radius: 7px; padding: 9px 12px; line-height: 1.6;
}
.modal-label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.modal-textarea {
  width: 100%; height: 260px;
  border: 1px solid var(--border); border-radius: 7px;
  padding: 10px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.6;
  background: var(--surface2); color: var(--text);
  resize: vertical; outline: none; transition: border-color .15s;
}
.modal-textarea:focus { border-color: var(--accent); }
.form-row { display: flex; align-items: center; gap: 10px; }
.form-label { font-size: 12.5px; font-weight: 500; min-width: 72px; }
.form-input {
  flex: 1; border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 11px; font-family: inherit; font-size: 12.5px;
  background: var(--surface2); color: var(--text); outline: none;
  transition: border-color .15s;
}
.form-input:focus { border-color: var(--accent); }

/* REORDER LIST ITEM */
.reorder-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 8px;
  cursor: grab; user-select: none; transition: all .15s;
}
.reorder-item:active { cursor: grabbing; }
.reorder-item.drag-over { border-color: var(--accent); background: var(--accent-light); border-style: dashed; }
.reorder-item.dragging { opacity: .4; }
.reorder-handle { color: var(--muted); font-size: 16px; flex-shrink: 0; }
.reorder-num { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 22px; flex-shrink: 0; }
.reorder-thumb { width: 107px; height: 60px; overflow: hidden; flex-shrink: 0; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); }
.reorder-thumb iframe { width: 1280px; height: 720px; border: none; transform: scale(0.0469); transform-origin: top left; pointer-events: none; }
.reorder-label { flex: 1; font-size: 12.5px; font-weight: 500; }
.reorder-arrow-btns { display: flex; gap: 4px; }
.reorder-arrow {
  width: 26px; height: 26px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--bg);
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; color: var(--text);
}
.reorder-arrow:hover { background: var(--accent-light); border-color: var(--accent); }

/* PROGRESS */
.prog-wrap { width: 100%; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; display: none; }
.prog-wrap.show { display: block; }
.prog-bar { height: 100%; background: var(--accent); border-radius: 3px; width: 0; transition: width .3s; }

/* TOAST */
.toast {
  position: fixed; bottom: 22px; right: 22px;
  background: var(--navy); color: #fff;
  padding: 11px 18px; border-radius: 9px;
  font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lg); z-index: 999;
  opacity: 0; transform: translateY(6px);
  transition: all .25s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.ok { background: var(--success); }
.toast.err { background: var(--danger); }

.slideshow-overlay {
  position: fixed;
  inset: 0;
  z-index: 350;
  background: rgba(0, 0, 0, 0.86);
  display: none;
  flex-direction: column;
}
.slideshow-overlay.open { display: flex; }
.slideshow-head {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 0 12px;
  color: #fff;
  background: rgba(0,0,0,0.38);
  border-bottom: 1px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
}
.slideshow-spacer { display: none; }
.slideshow-body {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 20px;
}
.slideshow-frame {
  width: 1280px;
  height: 720px;
  border: none;
  background: #fff;
  box-shadow: 0 16px 42px rgba(0,0,0,0.45);
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #b0b8cc; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="2" width="18" height="12" rx="2" stroke="white" stroke-width="1.5"/>
      <rect x="3.5" y="4.5" width="5" height="7" rx=".8" fill="rgba(255,255,255,.3)"/>
      <rect x="10.5" y="4.5" width="5.5" height="3" rx=".8" fill="rgba(255,255,255,.45)"/>
      <rect x="10.5" y="9" width="5.5" height="2" rx=".8" fill="rgba(255,255,255,.25)"/>
      <path d="M8 17h4M10 14v3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Slide Editor
  </div>
  <div class="topbar-div"></div>
  <div class="slide-badge" id="slideBadge">0 슬라이드</div>
  <div class="topbar-spacer"></div>
  <button class="tbtn ghost" onclick="openAddModal()">＋ 슬라이드 추가</button>
  <button class="tbtn accent" onclick="openReorderModal()">⇅ 순서 변경</button>
  <button class="tbtn ghost" onclick="exportMppFile()">.mpp 내보내기</button>
  <button class="tbtn ghost" onclick="triggerMppImport()">.mpp 불러오기</button>
  <button class="tbtn green" id="exportTopBtn" onclick="openExportModal()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 9.5v2h10v-2M6.5 1.5v7M3.5 5.5l3 3 3-3" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    PPTX 내보내기
  </button>
  <input id="mppInput" type="file" accept=".mpp,application/json,text/plain" style="display:none" onchange="importMppFile(event)"/>
</div>

<!-- BODY -->
<div class="app-body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-head">
      슬라이드
      <button class="sb-add-btn" onclick="openAddModal()" title="슬라이드 추가">＋</button>
    </div>
    <div class="slide-list" id="slideList"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="tabs">
      <div class="tab active" id="tab-single" onclick="switchView('single')">▶ 단일 보기</div>
      <div class="tab" id="tab-grid" onclick="switchView('grid')">⊞ 전체 보기</div>
      <div class="tab" id="tab-edit" onclick="switchView('edit')">✏ 편집</div>
    </div>

    <!-- SINGLE VIEW -->
    <div class="view active" id="view-single">
      <div class="nav-bar">

// Avoids "PptxGenJS is not defined" by loading only when needed
function loadPptxGen() {
  return new Promise((resolve, reject) => {
    if (window.PptxGenJS) { resolve(); return; }

    function tryLoad(url, fallbackUrl) {
      const s = document.createElement('script');
      s.src = url;
      s.onload = () => {
        if (window.PptxGenJS) { resolve(); }
        else if (fallbackUrl) { tryLoad(fallbackUrl, null); }
        else { reject(new Error('PptxGenJS 로드 후에도 정의되지 않음')); }
      };
      s.onerror = () => {
        if (fallbackUrl) { tryLoad(fallbackUrl, null); }
        else { reject(new Error('PptxGenJS CDN 로드 실패')); }
      };
      document.head.appendChild(s);
    }

    tryLoad(
      'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
      'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'
    );
  });
}

function esc(s) {

function getEditTextarea() {

function applyEditSubModeUI() {
  const rawToolbar = document.getElementById('rawEditToolbar');
  const rawTextarea = document.getElementById('editTA');
  const wysHost = document.querySelector('.edit-wysiwyg-host');
  const rawBtn = document.getElementById('btnRawEditMode');
  const wysBtn = document.getElementById('btnWysiwygEditMode');

  const rawOn = editSubMode === 'raw';
  if (rawToolbar) rawToolbar.classList.toggle('hidden', !rawOn);
  if (rawTextarea) rawTextarea.classList.toggle('hidden', !rawOn);
  if (wysHost) wysHost.classList.toggle('hidden', rawOn);
  if (rawBtn) rawBtn.classList.toggle('active', rawOn);
  if (wysBtn) wysBtn.classList.toggle('active', !rawOn);
}

function setEditSubMode(mode, userAction) {
  const next = mode === 'raw' ? 'raw' : 'wysiwyg';
  if (next === editSubMode && !userAction) {
    applyEditSubModeUI();
    return;
  }
  if (next === 'wysiwyg' && !froalaReady) {
    initFroalaEditorIfNeeded();
    if (!froalaReady) {
      editSubMode = 'raw';
      applyEditSubModeUI();
      return;
    }
  }

  if (next === 'raw') {
    const ta = getEditTextarea();
    if (ta) ta.value = getSlideRawHtml(slides[cur]);
  } else {
    const ta = getEditTextarea();
    if (ta) setEditHtml(ta.value);
  }

  editSubMode = next;
  applyEditSubModeUI();
}

function getEditHtml() {
  if (editSubMode === 'wysiwyg' && froalaReady && froalaEditor && froalaEditor.html && typeof froalaEditor.html.get === 'function') {
    return String(froalaEditor.html.get() || '');
  }
  const ta = getEditTextarea();
  return ta ? String(ta.value || '') : '';
}

function setEditHtml(html) {
  const v = String(html || '');
  const ta = getEditTextarea();
  if (ta) ta.value = v;
  if (froalaReady && froalaEditor && froalaEditor.html && typeof froalaEditor.html.set === 'function') {
    froalaEditor.html.set(v || '<p></p>');
    return;
  }
  pendingEditorHtml = v;
}

function initFroalaEditorIfNeeded() {
  if (froalaReady) return;
  if (typeof window.FroalaEditor !== 'function') {
    editSubMode = 'raw';
    applyEditSubModeUI();
    return;
  }
  const host = document.getElementById('editWysiwyg');
  if (!host) return;
  try {
    froalaEditor = new window.FroalaEditor('#editWysiwyg', {
      language: 'ko',
      attribution: false,
      toolbarSticky: false,
      quickInsertEnabled: false,
      charCounterCount: false,
      imageUpload: false,
      videoUpload: false,
      fileUpload: false,
      enter: window.FroalaEditor.ENTER_BR,
      heightMin: 280,
      toolbarButtons: {
        moreText: {
          buttons: ['bold', 'italic', 'underline', 'strikeThrough', 'fontSize', 'textColor', 'backgroundColor', 'inlineStyle', 'clearFormatting']
        },
        moreParagraph: {
          buttons: ['alignLeft', 'alignCenter', 'alignRight', 'formatOLSimple', 'formatUL', 'paragraphFormat', 'quote']
        },
        moreRich: {
          buttons: ['insertLink', 'insertImage', 'insertTable', 'emoticons', 'specialCharacters', 'insertHR']
        },
        moreMisc: {
          buttons: ['undo', 'redo', 'html', 'fullscreen']
        }
      },
      events: {
        initialized: function () {
          froalaReady = true;
          const ta = getEditTextarea();
          const initialHtml = pendingEditorHtml != null ? pendingEditorHtml : (ta ? ta.value : '');
          this.html.set(initialHtml || '<p></p>');
          pendingEditorHtml = null;
        },
        contentChanged: function () {
          if (!froalaReady) return;
          onEditInput();
        }
      }
    });
  } catch (e) {
    console.warn('Froala init failed, fallback to textarea:', e);
    froalaReady = false;
    froalaEditor = null;
    editSubMode = 'raw';
    applyEditSubModeUI();
  }
}

function normalizeHtml(h) {
  if (/^\s*<!DOCTYPE/i.test(h) || /^\s*<html/i.test(h)) return h;
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head><body style="margin:0;padding:0;">${h}</body></html>`;
}

// ── REORDER MODAL ───────────────────────────────────────────────────
function openReorderModal() {
  if (!slides.length) { toast('슬라이드가 없습니다', 'err'); return; }
  reorderOrder = slides.map((_, i) => i);
  renderReorderList();
  openModal('reorderModal');
}

function renderReorderList() {
  const list = document.getElementById('reorderList');
  list.innerHTML = '';
  reorderOrder.forEach((origIdx, pos) => {
    const sl = slides[origIdx];
    const item = document.createElement('div');
    item.className = 'reorder-item';
    item.dataset.pos = pos;
    item.draggable = true;
    const thumbScale = 60 / 720;
    item.innerHTML = `
      <span class="reorder-handle">⠿</span>
      <span class="reorder-num">${pos + 1}</span>
      <div class="reorder-thumb">
        <iframe srcdoc="${esc(sl.html)}" scrolling="no" sandbox="allow-same-origin allow-scripts"
          style="transform:scale(${thumbScale});transform-origin:top left;"></iframe>
      </div>
      <span class="reorder-label">슬라이드 ${origIdx + 1}</span>
      <div class="reorder-arrow-btns">
        <button class="reorder-arrow" onclick="moveReorder(${pos},-1)" title="위로">↑</button>
        <button class="reorder-arrow" onclick="moveReorder(${pos},1)" title="아래로">↓</button>
      </div>`;

    item.addEventListener('dragstart', e => {
      reorderDragIdx = pos;
      setTimeout(() => item.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      list.querySelectorAll('.reorder-item').forEach(el => el.classList.remove('drag-over'));
      reorderDragIdx = null;
    });
    item.addEventListener('dragover', e => {
      e.preventDefault();
      if (reorderDragIdx !== pos) item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      if (reorderDragIdx === null || reorderDragIdx === pos) return;
      const dragged = reorderOrder.splice(reorderDragIdx, 1)[0];
      reorderOrder.splice(pos, 0, dragged);
      reorderDragIdx = null;
      renderReorderList();
    });

    list.appendChild(item);
  });
}

function moveReorder(pos, dir) {
  const target = pos + dir;
  if (target < 0 || target >= reorderOrder.length) return;
  [reorderOrder[pos], reorderOrder[target]] = [reorderOrder[target], reorderOrder[pos]];
  renderReorderList();
}

function applyReorder() {
  const curHtml = slides[cur] ? slides[cur].html : null;
  slides = reorderOrder.map(i => slides[i]);
  if (curHtml) {
    const found = slides.findIndex(s => s.html === curHtml);
    cur = found >= 0 ? found : 0;
  } else { cur = 0; }
  closeModal('reorderModal');
  renderAll();
  toast('순서가 변경되었습니다', 'ok');
}

function wrapTag(tag) {
  if (froalaReady && froalaEditor) {
    froalaEditor.events.focus(true);
    if (tag === 'b') { froalaEditor.commands.exec('bold'); return; }
    if (tag === 'i') { froalaEditor.commands.exec('italic'); return; }
    if (tag === 'u') { froalaEditor.commands.exec('underline'); return; }
    froalaEditor.html.insert(`<${tag}></${tag}>`);
    onEditInput();
    return;
  }
  const ta = document.getElementById('editTA');
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  const sel = ta.value.substring(s, e2);
  ta.value = ta.value.substring(0, s) + `<${tag}>${sel}</${tag}>` + ta.value.substring(e2);
  ta.selectionStart = s + tag.length + 2;
  ta.selectionEnd = s + tag.length + 2 + sel.length;
  ta.focus();
  onEditInput();
}
function ins(tag) {
  if (froalaReady && froalaEditor) {

function fmtHTML() {
  if (froalaReady) {
    const html = getEditHtml();
    setEditHtml(html);
    onEditInput();
    return;
  }
  const ta = document.getElementById('editTA');
  let out = '', indent = 0;
  ta.value.split(/(<[^>]+>)/g).forEach(tok => {
    if (!tok.trim()) return;
    if (/^<\//.test(tok)) indent = Math.max(0, indent - 1);
    out += '  '.repeat(indent) + tok.trim() + '\n';
    if (/^<[^\/!][^>]*[^\/]>$/.test(tok) && !/^<(br|hr|img|input|meta|link)/i.test(tok)) indent++;
  });
  ta.value = out;
  onEditInput();
}
function exportMppFile() {
  if (!slides.length) {
    toast('슬라이드가 없습니다', 'err');
    return;
  }
  const filenameInput = document.getElementById('expFilename');
  const base = (filenameInput && filenameInput.value ? String(filenameInput.value).trim() : '') || 'presentation';
  const payload = {
    format: 'mdproviewer-html2pptx-mpp',
    version: 1,
    exportedAt: new Date().toISOString(),
    currentIndex: cur,
    slides: slides.map((s) => ({
      html: String((s && s.html) || ''),
      htmlRaw: String((s && (s.htmlRaw != null ? s.htmlRaw : s.html)) || '')
    }))
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = base + '.mpp';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('.mpp 파일을 저장했습니다.', 'ok');
}

async function importMppFile(event) {
  const input = event && event.target ? event.target : document.getElementById('mppInput');
  const file = input && input.files ? input.files[0] : null;
  if (!file) return;

  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    const incoming = Array.isArray(parsed && parsed.slides) ? parsed.slides : [];
    const normalized = incoming
      .map((item) => {
        if (typeof item === 'string') {
          const h = String(item || '').trim();
          return h ? { html: normalizeHtml(h), htmlRaw: normalizeHtml(h) } : null;
        }
        const html = String((item && item.html) || '').trim();
        if (!html) return null;
        const raw = String((item && (item.htmlRaw != null ? item.htmlRaw : item.html)) || '').trim() || html;
        return { html: normalizeHtml(html), htmlRaw: normalizeHtml(raw) };
      })
      .filter((item) => !!item);

    if (!normalized.length) {
      throw new Error('슬라이드 데이터가 비어 있습니다.');
    }

    slides = normalized;
    const nextCur = Number(parsed && parsed.currentIndex);
    cur = Number.isFinite(nextCur) ? Math.max(0, Math.min(normalized.length - 1, nextCur)) : 0;
    switchView('single');
    renderAll();
    toast('.mpp 불러오기 완료 (' + slides.length + '개 슬라이드)', 'ok');
  } catch (err) {
    toast('.mpp 파일 파싱 실패: ' + ((err && err.message) ? err.message : 'unknown error'), 'err');
  } finally {
    if (input) input.value = '';
  }
}

async function doExport() {
  if (!slides.length) { toast('슬라이드가 없습니다', 'err'); return; }

  const btn = document.getElementById('expBtn');
  const progWrap = document.getElementById('expProg');
  const bar = document.getElementById('expBar');
  const status = document.getElementById('expStatus');

  btn.disabled = true;
  btn.textContent = '내보내기 준비 중...';
  progWrap.classList.add('show');
  status.textContent = '슬라이드를 분석 중입니다...';

  const filename = document.getElementById('expFilename').value.trim() || 'presentation';
  const author = document.getElementById('expAuthor').value.trim() || 'Slide Editor';
  const layout = document.getElementById('expLayout').value;
  const mode = (document.getElementById('expMode') && document.getElementById('expMode').value) || 'image';

  try {
    if (!window.Html2PptxExport || typeof window.Html2PptxExport.exportSlides !== 'function') {
      throw new Error('html2pptx_ex.js 로더를 찾을 수 없습니다.');
    }

    await window.Html2PptxExport.exportSlides({
      slides,
      filename,
      author,
      layout,
      mode,
      onProgress: ({ phase, index, total }) => {
        if (phase === 'analyze') {
          bar.style.width = ((index / Math.max(1, total)) * 20) + '%';
          status.textContent = `슬라이드 분석 중... (${index + 1} / ${total})`;
          btn.textContent = '분석 중...';
          return;
        }
        if (phase === 'capture') {
          bar.style.width = 20 + ((index / Math.max(1, total)) * 60) + '%';
          status.textContent = `슬라이드 캡처/변환 중... (${index + 1} / ${total})`;
          btn.textContent = `⏳ ${index + 1}/${total} 처리 중...`;
          return;
        }
        if (phase === 'writing') {
          bar.style.width = '95%';
          status.textContent = 'PPTX 파일 생성 중...';
          btn.textContent = '파일 저장 중...';
          return;
        }
        if (phase === 'done') {
          bar.style.width = '100%';
          status.textContent = '완료!';
          btn.textContent = '완료';
        }
      }
    });

    setTimeout(() => {
      closeModal('exportModal');
      toast('PPTX 다운로드 완료!', 'ok');
    }, 500);
  } catch (err) {
    console.error(err);
    toast('오류: ' + err.message, 'err');
    status.textContent = '오류 발생: ' + err.message;
    btn.disabled = false;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 9.5v2h10v-2M6.5 1.5v7M3.5 5.5l3 3 3-3" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> PPTX 다운로드`;
  }
}
function captureSlide(html) {
  return new Promise(resolve => {
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:fixed;left:-9999px;top:0;width:1280px;height:720px;z-index:-999;overflow:hidden;';
    document.body.appendChild(wrapper);

    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:1280px;height:720px;border:none;';
    iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts');
    wrapper.appendChild(iframe);

    function cleanup() {
      try { document.body.removeChild(wrapper); } catch(e) {}
    }

    iframe.onload = () => {
      const doc = iframe.contentDocument;
      if (!doc) { cleanup(); resolve(blankCanvas('no doc')); return; }

      const sc = doc.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

      sc.onload = () => {
        setTimeout(() => {
          try {
            iframe.contentWindow.html2canvas(doc.documentElement, {
              width: 1280, height: 720, scale: 1,
              useCORS: true, allowTaint: true, logging: false,
              backgroundColor: '#ffffff'
            }).then(canvas => {
              cleanup();
              resolve(canvas.toDataURL('image/jpeg', 0.93));
            }).catch(err => {
              cleanup(); resolve(blankCanvas(err.message));
            });
          } catch(e) { cleanup(); resolve(blankCanvas(e.message)); }
        }, 500);
      };

      sc.onerror = () => { cleanup(); resolve(blankCanvas('html2canvas 로드 실패')); };
      doc.head.appendChild(sc);
    };

    iframe.onerror = () => { cleanup(); resolve(blankCanvas('iframe 오류')); };
    iframe.srcdoc = html;
  });
}

function blankCanvas(msg) {
  const c = document.createElement('canvas');
  c.width = 1280; c.height = 720;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1280, 720);
  ctx.fillStyle = '#888888'; ctx.font = '18px Arial';
  ctx.fillText('렌더링 불가: ' + (msg || ''), 40, 360);
  return c.toDataURL('image/jpeg');
}

// ── MODAL HELPERS ───────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.addEventListener('click', e => {
  ['addModal','reorderModal','exportModal'].forEach(id => {
    if (e.target.id === id) closeModal(id);
  });
});

// ── TOAST ───────────────────────────────────────────────────────────
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── KEYBOARD ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ['addModal','reorderModal','exportModal'].forEach(closeModal);
    if (slideShowOpen) {
      endSlideShow();
      return;
    }
  }
  if (slideShowOpen && !e.target.matches('textarea, input, select')) {
    if (e.key === 'ArrowLeft')  { e.preventDefault(); slideShowNav(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); slideShowNav(1); }
    return;
  }
  if (curView !== 'edit' && !e.target.matches('textarea, input, select')) {
    if (e.key === 'ArrowLeft')  { e.preventDefault(); nav(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); nav(1); }
  }
});
</script>
</body>
