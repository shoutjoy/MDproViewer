<button type="button" id="btn-export-gdocs" onclick="openToDocs()"
    class="hidden px-2 py-1 sm:px-3 sm:py-1.5 rounded-md text-[10px] sm:text-xs font-medium bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-200 dark:hover:bg-emerald-900/60 shrink-0 border border-emerald-300 dark:border-emerald-700"
    title="Copy styled content and open linked Google Doc">ToDocs</button>
<button type="button" id="btn-docsync" onclick="toggleGoogleDocSync()"
    class="hidden px-2 py-1 sm:px-3 sm:py-1.5 rounded-md text-[10px] sm:text-xs font-medium bg-teal-100 dark:bg-teal-900/40 text-teal-700 dark:text-teal-300 hover:bg-teal-200 dark:hover:bg-teal-900/60 shrink-0 border border-teal-300 dark:border-teal-700"
    title="Realtime sync this file with Google Docs">DocSyn</button>
